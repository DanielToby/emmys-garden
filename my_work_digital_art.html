<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Art — Emily Briggs</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }
    .page-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .page-header h1 {
      font-size: 3rem;
    }
    .back-link {
      display: inline-block;
      font-family: "EmTitle";
      font-size: 1.1rem;
      color: #7D012F;
      text-decoration: none;
      margin-bottom: 1.5rem;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .photo-grid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <a class="back-link" href="my_work.html">← My Work</a>
    <div class="page-header">
      <h1>Digital Art</h1>
    </div>
    <div class="photo-grid">
      <img src="assets/my_work/digital_art/5A6E35E3-DE82-475B-90A3-1F4BC0F44908.jpg" alt="Digital art">
      <img src="assets/my_work/digital_art/IMG_0098.JPG" alt="Digital art">
      <img src="assets/my_work/digital_art/IMG_0100.JPG" alt="Digital art">
      <img src="assets/my_work/digital_art/Untitled_Artwork 4.jpg" alt="Digital art">
      <img src="assets/my_work/digital_art/Untitled_Artwork 5.jpg" alt="Digital art">
    </div>
  </div>
</body>
</html>
