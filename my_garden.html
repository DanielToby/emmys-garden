<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Garden — Emily Briggs</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }

    .page-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .page-header h1 {
      font-size: 3rem;
    }

    .back-link {
      display: inline-block;
      font-family: "EmTitle";
      font-size: 1.1rem;
      color: #7D012F;
      text-decoration: none;
      margin-bottom: 1.5rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .photo-grid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
